<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Games</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#f4f1ff;--bg-2:#e7fbff;--surface:#fff;--ink:#241b4e;--muted:#6b6790;--line:#e7e3f5;
            --primary:#6d28d9;--primary-2:#9333ea;--primary-rgb:109,40,217;--danger:#ff3d7f;--ok:#22c55e;--radius:18px;
            --font-head:'Fredoka',sans-serif;--font-body:'Nunito',sans-serif;
        }
        .dark-mode{--bg:#14122e;--bg-2:#0e1330;--surface:#211d44;--ink:#efeaff;--muted:#a9a3d6;--line:#352f63;--primary:#a78bfa;--primary-2:#c084fc;--primary-rgb:167,139,250;--danger:#ff5c93;}
        *{box-sizing:border-box;} html,body{height:100%;}
        body{margin:0;font-family:var(--font-body);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden;
            background:radial-gradient(1200px 700px at 85% -15%,var(--bg-2),var(--bg)) fixed;transition:background .3s,color .3s;}
        button{font-family:var(--font-body);}
        .topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 4px 16px rgba(var(--primary-rgb),.35);}
        .brand{display:flex;align-items:center;gap:8px;font-family:var(--font-head);font-weight:700;font-size:clamp(14px,2.6vw,18px);}
        .spacer{flex:1 1 auto;}
        .icon-btn{width:34px;height:34px;border-radius:10px;border:none;cursor:pointer;background:rgba(255,255,255,.16);color:#fff;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:.15s;}
        .icon-btn:hover{background:rgba(255,255,255,.3);} .icon-btn:active{transform:scale(.92);} .icon-btn.on{background:#ffd34d;color:#7a4b00;}
        .icon-btn.star-hint{animation:starPulse 1.1s ease-in-out infinite;}
        @keyframes starPulse{0%,100%{box-shadow:0 0 0 rgba(255,211,77,0);}50%{box-shadow:0 0 0 6px rgba(255,211,77,.5);}}
        main{flex:1 1 auto;min-height:0;overflow:auto;padding:14px;}
        h2{font-family:var(--font-head);margin:.2em 0 .5em;}
        label.fld{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px 3px;}
        input[type=text],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px;font-family:var(--font-body);font-size:14px;font-weight:600;}
        textarea{min-height:130px;resize:vertical;}
        .seg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px;}
        .seg button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:800;padding:9px 14px;border-radius:30px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;}
        .seg button.active{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2));border-color:transparent;box-shadow:0 5px 14px rgba(var(--primary-rgb),.35);}
        .btn{border:none;cursor:pointer;font-weight:800;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.12s;font-family:var(--font-body);}
        .btn:active{transform:scale(.97);}
        .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;padding:13px 20px;font-size:15px;box-shadow:0 8px 20px rgba(var(--primary-rgb),.35);}
        .btn-soft{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:11px 16px;}
        .hint{font-size:12px;color:var(--muted);margin-top:8px;}
        .linkbox{display:flex;gap:8px;margin-top:10px;}
        .linkbox input{font-weight:600;font-size:12px;}
        .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:12px;}

        /* PLAY */
        .play{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;}
        .ptitle{font-family:var(--font-head);font-weight:700;color:var(--primary);font-size:clamp(1.1rem,3.4vmin,2rem);}
        .word{display:flex;gap:clamp(6px,1.6vmin,14px);flex-wrap:wrap;justify-content:center;}
        .slot{font-family:var(--font-head);font-weight:700;font-size:clamp(1.6rem,7vmin,4.5rem);min-width:clamp(22px,7vmin,60px);border-bottom:4px solid var(--primary);line-height:1.1;}
        .slot.space{border:none;min-width:clamp(10px,3vmin,30px);}
        .keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(34px,1fr));gap:6px;max-width:560px;width:100%;}
        .key{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:800;cursor:pointer;font-size:1rem;}
        .key:disabled{opacity:.35;cursor:default;}
        .key.good{background:var(--ok);color:#fff;border-color:transparent;} .key.bad{background:var(--danger);color:#fff;border-color:transparent;}
        .gallows{filter:drop-shadow(0 6px 10px rgba(0,0,0,.15));}
        .gallows .part{stroke:var(--ink);stroke-width:6;stroke-linecap:round;fill:none;opacity:0;transition:opacity .25s;}
        .gallows .part.show{opacity:1;}
        .scram{font-family:var(--font-head);font-weight:700;letter-spacing:6px;font-size:clamp(2rem,10vmin,6rem);color:var(--primary);}
        .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
        .chip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:800;font-size:clamp(1rem,2.6vmin,1.5rem);cursor:pointer;transition:.12s;}
        .chip:active{transform:scale(.95);}
        .answer-line{min-height:48px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;border:2px dashed var(--line);border-radius:12px;padding:8px;min-width:60%;}
        .progress{font-size:13px;color:var(--muted);font-weight:700;}
        .play-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
        #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:900;}
        .msg{font-family:var(--font-head);font-weight:700;font-size:clamp(1.2rem,4vmin,2.2rem);}
        .msg.win{color:var(--ok);} .msg.lose{color:var(--danger);}
    </style>
</head>
<body>
    <canvas id="confetti"></canvas>
    <div class="topbar">
        <div class="brand"><i class="fas fa-spell-check"></i> Word Games</div>
        <div class="spacer"></div>
        <button class="icon-btn" id="starBtn" onclick="toggleBookmark()" title="Bookmark this game to the slide"><i class="far fa-star"></i></button>
        <button class="icon-btn" id="editBtn" onclick="goEdit()" title="Edit / Build" style="display:none"><i class="fas fa-pen"></i></button>
        <button class="icon-btn" id="muteBtn" onclick="toggleMute()" title="Sound"><i class="fas fa-volume-high"></i></button>
        <button class="icon-btn" id="darkBtn" onclick="toggleDark()" title="Dark mode"><i class="fas fa-moon"></i></button>
    </div>

    <main>
        <!-- BUILDER -->
        <div id="builder">
            <h2>Create a word game</h2>
            <div class="seg" id="gameSeg">
                <button class="active" data-g="hg" onclick="pickGame('hg')"><i class="fas fa-person-hiking"></i> Hangman</button>
                <button data-g="sc" onclick="pickGame('sc')"><i class="fas fa-shuffle"></i> Word Scramble</button>
                <button data-g="se" onclick="pickGame('se')"><i class="fas fa-quote-left"></i> Sentence Unscramble</button>
            </div>
            <label class="fld">Title (optional)</label>
            <input type="text" id="title" placeholder="e.g. Science Vocabulary" oninput="saveDraft()">
            <label class="fld" id="inputLabel">Words — one per line (add a hint with "word | hint")</label>
            <textarea id="items" placeholder="photosynthesis | how plants make food&#10;gravity | pulls things down" oninput="saveDraft()"></textarea>
            <div id="hintNote" class="hint">Tip: students guess letter by letter. Add an optional hint after a “|”.</div>
            <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
                <button class="btn btn-primary" onclick="generate()"><i class="fas fa-play"></i> Play now</button>
                <button class="btn btn-soft" onclick="copyLink()"><i class="fas fa-link"></i> Copy share link</button>
            </div>
            <div id="linkArea" class="card" style="display:none">
                <label class="fld">Shareable link (contains the whole game)</label>
                <div class="linkbox"><input type="text" id="linkOut" readonly onclick="this.select()"><button class="btn btn-soft" onclick="copyLink()"><i class="fas fa-copy"></i></button></div>
                <div class="hint">Anyone who opens this link gets the game — no account or saving needed. Click the ⭐ to pin it to this PowerPoint slide.</div>
            </div>
        </div>

        <!-- PLAYER -->
        <div id="player" class="play" style="display:none"></div>
    </main>

    <script>
        /* ===== THEME ===== */
        const THEME_KEY='ct-theme';
        function readDark(){try{return localStorage.getItem(THEME_KEY)==='dark';}catch(e){return false;}}
        function applyTheme(d){document.body.classList.toggle('dark-mode',d);document.getElementById('darkBtn').innerHTML=d?'<i class="fas fa-sun"></i>':'<i class="fas fa-moon"></i>';}
        function toggleDark(){const d=!document.body.classList.contains('dark-mode');try{localStorage.setItem(THEME_KEY,d?'dark':'light');}catch(e){}applyTheme(d);}
        window.addEventListener('storage',e=>{if(e.key===THEME_KEY)applyTheme(e.newValue==='dark');});

        /* ===== SOUND ===== */
        let actx=null,mg=null,muted=false;
        function ea(){if(!actx){const A=window.AudioContext||window.webkitAudioContext;actx=new A();mg=actx.createGain();mg.gain.value=.16;mg.connect(actx.destination);}if(actx.state==='suspended')actx.resume();}
        function tn(f,d,t,v,w){if(muted)return;ea();const t0=actx.currentTime+(w||0),o=actx.createOscillator(),g=actx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v||.5,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(mg);o.start(t0);o.stop(t0+d+.03);}
        function mar(f,w,v){tn(f,.4,'triangle',v||.5,w);tn(f*2,.28,'sine',(v||.5)*.22,w);}
        function sGood(){mar(659.25,0,.5);} function sBad(){tn(196,.18,'sawtooth',.25);} function sKey(){tn(720,.04,'sine',.18);}
        function sWin(){mar(523.25,0,.55);mar(659.25,.09,.55);mar(783.99,.18,.55);mar(1046.5,.3,.6);}
        function toggleMute(){muted=!muted;const b=document.getElementById('muteBtn');b.classList.toggle('on',muted);b.innerHTML=muted?'<i class="fas fa-volume-xmark"></i>':'<i class="fas fa-volume-high"></i>';if(!muted){ea();mar(880,0,.4);}}

        /* ===== CONFETTI ===== */
        const PAL=['#6d28d9','#ff3d7f','#14d6c4','#ffb020','#2f6bff','#22c55e','#ef4444','#f97316'];
        function confetti(ms){const c=document.getElementById('confetti'),W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d'),p=[];for(let i=0;i<90;i++)p.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*9,vy:Math.random()*-9-4,g:.22+Math.random()*.12,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:PAL[i%PAL.length]});const end=performance.now()+(ms||1600);(function f(n){x.clearRect(0,0,W,H);p.forEach(o=>{o.vy+=o.g;o.x+=o.vx;o.y+=o.vy;o.r+=o.vr;x.save();x.translate(o.x,o.y);x.rotate(o.r);x.fillStyle=o.c;x.globalAlpha=.9;x.fillRect(-o.s/2,-o.s/2,o.s,o.s*.6);x.restore();});if(n<end)requestAnimationFrame(f);else x.clearRect(0,0,W,H);})(performance.now());}

        /* ===== ENCODE/DECODE (data lives in the link) ===== */
        function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
        function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s))));}
        function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
        function shuffleSeeded(arr,seed){const r=mulberry(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

        /* ===== BUILDER ===== */
        let curGame='hg';
        function pickGame(g){curGame=g;document.querySelectorAll('#gameSeg button').forEach(b=>b.classList.toggle('active',b.dataset.g===g));
            const lbl=document.getElementById('inputLabel'),note=document.getElementById('hintNote'),items=document.getElementById('items');
            if(g==='hg'){lbl.textContent='Words — one per line (optional hint: "word | hint")';note.textContent='Students guess letter by letter. Add an optional hint after a “|”.';items.placeholder='photosynthesis | how plants make food';}
            if(g==='sc'){lbl.textContent='Words to scramble — one per line';note.textContent='Letters are jumbled; students unscramble each word.';items.placeholder='elephant\nrainbow\nvolcano';}
            if(g==='se'){lbl.textContent='Sentences — one per line';note.textContent='Words are shuffled; students tap them in the right order.';items.placeholder='The quick brown fox jumps.\nWater boils at one hundred degrees.';}
            saveDraft();
        }
        function parseItems(){return document.getElementById('items').value.split('\n').map(s=>s.trim()).filter(Boolean);}
        function buildPayload(){
            const t=document.getElementById('title').value.trim();
            const raw=parseItems();
            if(!raw.length)return null;
            if(curGame==='hg'){const words=raw.map(l=>{const[w,h]=l.split('|');return{w:(w||'').trim(),h:(h||'').trim()};}).filter(o=>o.w);return{g:'hg',t,words};}
            if(curGame==='sc'){return{g:'sc',t,words:raw,seed:Math.floor(Math.random()*1e9)};}
            if(curGame==='se'){return{g:'se',t,sent:raw,seed:Math.floor(Math.random()*1e9)};}
        }
        function linkFor(payload){return location.origin+location.pathname+'#d='+enc(payload);}
        function generate(){const p=buildPayload();if(!p){flash('Add at least one item.');return;}location.hash='d='+enc(p);render();}
        function copyLink(){const p=buildPayload();if(!p){flash('Add at least one item.');return;}const url=linkFor(p);const out=document.getElementById('linkOut');document.getElementById('linkArea').style.display='block';out.value=url;out.select();try{navigator.clipboard.writeText(url);}catch(e){}flash('Link copied — it contains the whole game.');}
        function flash(m){const n=document.getElementById('hintNote');const o=n.textContent;n.textContent=m;n.style.color='var(--primary)';setTimeout(()=>{n.textContent=o;n.style.color='';},2200);}
        function saveDraft(){try{localStorage.setItem('ct-wg-draft',JSON.stringify({g:curGame,t:document.getElementById('title').value,items:document.getElementById('items').value}));}catch(e){}updateStarHint();}
        function loadDraft(){try{const d=JSON.parse(localStorage.getItem('ct-wg-draft'));if(d){pickGame(d.g||'hg');document.getElementById('title').value=d.t||'';document.getElementById('items').value=d.items||'';}}catch(e){}}

        function goEdit(){location.hash='';render();}

        /* ===== PLAYER ===== */
        let state=null;
        function render(){
            const hash=location.hash.replace(/^#/,'');
            const m=hash.match(/d=(.+)$/);
            const builder=document.getElementById('builder'),player=document.getElementById('player'),editBtn=document.getElementById('editBtn');
            if(m){ let p; try{p=dec(m[1]);}catch(e){p=null;} if(p){ builder.style.display='none'; player.style.display='flex'; editBtn.style.display=''; startGame(p); updateStarHint(); return; } }
            builder.style.display='block'; player.style.display='none'; editBtn.style.display='none'; updateStarHint();
        }
        function startGame(p){ state={p,idx:0}; if(p.g==='hg')renderHangman(); else if(p.g==='sc')renderScramble(); else if(p.g==='se')renderSentence(); }
        function nextItem(total,fn){ state.idx++; if(state.idx>=total){state.idx=0;} fn(); }
        function titleHtml(p){return p.t?'<div class="ptitle">'+esc(p.t)+'</div>':'';}
        function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

        /* Hangman */
        function renderHangman(){
            const p=state.p, item=p.words[state.idx], word=item.w.toUpperCase(), guessed=new Set(); let wrong=0;
            const player=document.getElementById('player');
            player.innerHTML=titleHtml(p)+
                '<svg class="gallows" width="180" height="200" viewBox="0 0 180 200">'+
                '<path class="part show" d="M10 190 H110"/><path class="part show" d="M40 190 V20"/><path class="part show" d="M40 20 H120"/><path class="part show" d="M120 20 V45"/>'+
                '<circle class="part" id="g0" cx="120" cy="62" r="17"/>'+
                '<path class="part" id="g1" d="M120 79 V125"/>'+
                '<path class="part" id="g2" d="M120 90 L98 110"/><path class="part" id="g3" d="M120 90 L142 110"/>'+
                '<path class="part" id="g4" d="M120 125 L100 155"/><path class="part" id="g5" d="M120 125 L140 155"/></svg>'+
                '<div class="progress">Word '+(state.idx+1)+' of '+p.words.length+(item.h?' · Hint: '+esc(item.h):'')+'</div>'+
                '<div class="word" id="hgWord"></div>'+
                '<div class="msg" id="hgMsg"></div>'+
                '<div class="keys" id="hgKeys"></div>'+
                '<div class="play-actions"><button class="btn btn-soft" onclick="renderHangman.skip()"><i class="fas fa-forward"></i> Next word</button></div>';
            const wordEl=document.getElementById('hgWord'), keysEl=document.getElementById('hgKeys'), msg=document.getElementById('hgMsg');
            function draw(){ wordEl.innerHTML=word.split('').map(ch=>{ if(ch===' ')return '<span class="slot space"></span>'; const show=guessed.has(ch); return '<span class="slot">'+(show?ch:'')+'</span>'; }).join(''); }
            function done(win){ Array.from(keysEl.children).forEach(b=>b.disabled=true); if(win){msg.textContent='🎉 Correct!';msg.className='msg win';sWin();confetti();} else {msg.textContent='The word was '+word;msg.className='msg lose';sBad();} }
            'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(ch=>{ const b=document.createElement('button'); b.className='key'; b.textContent=ch; b.onclick=()=>{ if(guessed.has(ch))return; guessed.add(ch); if(word.includes(ch)){b.classList.add('good');sKey();} else {b.classList.add('bad');wrong++;sBad();const g=document.getElementById('g'+(wrong-1));if(g)g.classList.add('show');} b.disabled=true; draw(); if(word.replace(/ /g,'').split('').every(c=>guessed.has(c)))done(true); else if(wrong>=6)done(false); }; keysEl.appendChild(b); });
            draw();
            renderHangman.skip=function(){ state.idx=(state.idx+1)%p.words.length; renderHangman(); };
        }

        /* Scramble */
        function renderScramble(){
            const p=state.p, word=p.words[state.idx], scr=scramble(word,p.seed+state.idx);
            const player=document.getElementById('player');
            player.innerHTML=titleHtml(p)+'<div class="progress">Word '+(state.idx+1)+' of '+p.words.length+'</div>'+
                '<div class="scram">'+esc(scr.toUpperCase())+'</div>'+
                '<input type="text" id="scIn" placeholder="Type your answer" style="max-width:340px;text-align:center" autocomplete="off">'+
                '<div class="msg" id="scMsg"></div>'+
                '<div class="play-actions"><button class="btn btn-primary" onclick="renderScramble.check()"><i class="fas fa-check"></i> Check</button>'+
                '<button class="btn btn-soft" onclick="renderScramble.reveal()"><i class="fas fa-eye"></i> Reveal</button>'+
                '<button class="btn btn-soft" onclick="renderScramble.next()"><i class="fas fa-forward"></i> Next</button></div>';
            const inp=document.getElementById('scIn'), msg=document.getElementById('scMsg');
            inp.addEventListener('keydown',e=>{if(e.key==='Enter')renderScramble.check();});
            renderScramble.check=function(){ if(inp.value.trim().toLowerCase()===word.toLowerCase()){msg.textContent='🎉 Correct!';msg.className='msg win';sWin();confetti();} else {msg.textContent='Try again!';msg.className='msg lose';sBad();} };
            renderScramble.reveal=function(){ msg.textContent=word.toUpperCase(); msg.className='msg'; sKey(); };
            renderScramble.next=function(){ state.idx=(state.idx+1)%p.words.length; renderScramble(); };
        }
        function scramble(word,seed){ if(word.length<2)return word; let s; do{ s=shuffleSeeded(word.split(''),seed).join(''); seed++; }while(s===word && word.length>1); return s; }

        /* Sentence Unscramble */
        function renderSentence(){
            const p=state.p, sentence=p.sent[state.idx], words=sentence.replace(/\s+/g,' ').trim().split(' ');
            const order=shuffleSeeded(words.map((w,i)=>i),p.seed+state.idx);
            const player=document.getElementById('player'); let answer=[];
            player.innerHTML=titleHtml(p)+'<div class="progress">Sentence '+(state.idx+1)+' of '+p.sent.length+'</div>'+
                '<div class="answer-line" id="seAns"></div>'+
                '<div class="chips" id="sePool"></div>'+
                '<div class="msg" id="seMsg"></div>'+
                '<div class="play-actions"><button class="btn btn-primary" onclick="renderSentence.check()"><i class="fas fa-check"></i> Check</button>'+
                '<button class="btn btn-soft" onclick="renderSentence.reset()"><i class="fas fa-rotate-left"></i> Reset</button>'+
                '<button class="btn btn-soft" onclick="renderSentence.next()"><i class="fas fa-forward"></i> Next</button></div>';
            const pool=document.getElementById('sePool'), ans=document.getElementById('seAns'), msg=document.getElementById('seMsg');
            function drawPool(){ pool.innerHTML=''; order.forEach(idx=>{ if(answer.includes(idx))return; const c=document.createElement('div'); c.className='chip'; c.textContent=words[idx]; c.onclick=()=>{answer.push(idx);sKey();drawPool();drawAns();}; pool.appendChild(c); }); }
            function drawAns(){ ans.innerHTML=''; answer.forEach((idx,pos)=>{ const c=document.createElement('div'); c.className='chip'; c.textContent=words[idx]; c.onclick=()=>{answer.splice(pos,1);drawPool();drawAns();}; ans.appendChild(c); }); }
            renderSentence.check=function(){ const built=answer.map(i=>words[i]).join(' '); if(built===words.join(' ')){msg.textContent='🎉 Correct!';msg.className='msg win';sWin();confetti();} else {msg.textContent='Not yet — keep trying!';msg.className='msg lose';sBad();} };
            renderSentence.reset=function(){ answer=[]; drawPool(); drawAns(); msg.textContent=''; };
            renderSentence.next=function(){ state.idx=(state.idx+1)%p.sent.length; renderSentence(); };
            drawPool(); drawAns();
        }

        /* ===== BOOKMARK BRIDGE ===== */
        const EMBEDDED = window.parent && window.parent !== window;
        let bookmarked=false;
        function currentLabel(){ const g={hg:'Hangman',sc:'Word Scramble',se:'Sentence Unscramble'}; let t=''; try{const m=location.hash.match(/d=(.+)$/); if(m){const p=dec(m[1]); t=(p.t?p.t+' · ':'')+(g[p.g]||'Word Game');}}catch(e){} return 'Word Games' + (t?' — '+t:''); }
        function toggleBookmark(){
            const playing = location.hash.indexOf('d=')>=0;
            if(!playing){ flashStar('Generate or play a game first, then bookmark it.'); return; }
            bookmarked=!bookmarked;
            const url = bookmarked ? location.href : null;
            if(EMBEDDED){ try{ window.parent.postMessage({ns:'classtools',cmd:'bookmark',url,label:currentLabel()},'*'); }catch(e){} }
            else { try{ url?localStorage.setItem('ct-bookmark',JSON.stringify({url,label:currentLabel()})):localStorage.removeItem('ct-bookmark'); }catch(e){} }
            updateStar();
        }
        function updateStar(){ const b=document.getElementById('starBtn'); b.classList.toggle('on',bookmarked); b.innerHTML=bookmarked?'<i class="fas fa-star"></i>':'<i class="far fa-star"></i>'; b.title=bookmarked?'Bookmarked to this slide':'Bookmark this game to the slide'; }
        function updateStarHint(){ const b=document.getElementById('starBtn'); const playing=location.hash.indexOf('d=')>=0; b.classList.toggle('star-hint', playing && !bookmarked); }
        function flashStar(m){ const n=document.getElementById('hintNote'); if(n){const o=n.textContent;n.textContent=m;n.style.color='var(--danger)';setTimeout(()=>{n.textContent=o;n.style.color='';},2400);} }

        window.addEventListener('hashchange',render);

        /* ===== BOOT ===== */
        applyTheme(readDark());
        loadDraft();
        render();
    </script>
</body>
</html>
