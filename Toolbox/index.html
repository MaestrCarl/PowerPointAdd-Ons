<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassTools</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Luckiest+Guy&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/classtools-ui.css">
    <script src="../shared/classtools-ui.js" defer></script>
    <script src="../shared/classtools-account.js" defer></script>
    <script src="../../assets/tool-shell.js" data-root="../../" defer></script>
    <style>
        :root{--bg:#F2F5FA;--bg-2:#E9F1F8;--surface:#fff;--ink:#212B40;--muted:#5C6880;--line:#DEE5F0;
            --primary:#25426B;--primary-2:#3D6396;--primary-rgb:37,66,107;--radius:18px;--gold:#ffb020;
            --font-head:'Baloo 2',sans-serif;--font-body:'Nunito',sans-serif;--font-logo:'Luckiest Guy',cursive;}
        .dark-mode{--bg:#10151F;--bg-2:#1C2740;--surface:#171E2C;--ink:#E9ECF3;--muted:#A9B1C0;--line:#2A3347;--primary:#6C92C7;--primary-2:#8FB0DC;--primary-rgb:108,146,199;}
        *{box-sizing:border-box;}
        body{font-family:var(--font-body);margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(1200px 700px at 85% -15%,var(--bg-2),var(--bg)) fixed;overflow-x:hidden;transition:background .3s,color .3s;}
        .topbar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 4px 16px rgba(var(--primary-rgb),.35);}
        .topbar .brand{display:flex;align-items:center;gap:9px;font-family:var(--font-logo);font-weight:400;font-size:20px;letter-spacing:.5px;}
        .topbar .spacer{flex:1 1 auto;}
        .icon-btn{width:34px;height:34px;border-radius:10px;border:none;cursor:pointer;background:rgba(255,255,255,.16);color:#fff;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:.15s;}
        .icon-btn:hover{background:rgba(255,255,255,.3);}.icon-btn:active{transform:scale(.92);}

        #menu-view{padding:22px 22px 40px;}
        .hub-header{text-align:center;margin-bottom:18px;}
        .hub-header h1{margin:0;font-family:var(--font-logo);font-size:30px;font-weight:400;letter-spacing:.5px;}
        .hub-header p{margin:6px 0 0;font-size:13px;color:var(--muted);}
        .pinned{max-width:720px;margin:0 auto 18px;display:none;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;}
        .pinned i.star{color:var(--gold);} .pinned .lbl{font-weight:800;} .pinned .go{margin-left:auto;}
        .pinned button{border:none;cursor:pointer;font-family:var(--font-body);font-weight:800;border-radius:10px;padding:8px 13px;}
        .pinned .open{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;}
        .pinned .clear{background:var(--bg);color:var(--muted);border:1px solid var(--line);}
        .section{max-width:720px;margin:0 auto 18px;}
        .section h2{font-family:var(--font-head);font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 10px 4px;}
        .tool-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
        .tool-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 14px;text-align:center;cursor:pointer;transition:all .2s ease;display:flex;flex-direction:column;align-items:center;gap:10px;}
        .tool-card:hover{transform:translateY(-5px);border-color:transparent;box-shadow:0 14px 30px rgba(var(--primary-rgb),.28);}
        .tool-card .icon{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:25px;color:#fff;background:linear-gradient(135deg,var(--c1,var(--primary)),var(--c2,var(--primary-2)));box-shadow:0 8px 18px rgba(var(--primary-rgb),.4);}
        .tool-card h3{margin:0;font-family:var(--font-head);font-size:15px;font-weight:600;}
        .tool-card p{margin:0;font-size:12px;color:var(--muted);line-height:1.4;}
        .hub-footer{text-align:center;margin-top:24px;font-size:11px;color:var(--muted);}

        #tool-view{display:none;flex-direction:column;height:100vh;}
        .tool-bar{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex:0 0 auto;}
        .tool-bar button.back{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border:none;padding:9px 15px;border-radius:30px;cursor:pointer;font-family:var(--font-body);font-weight:800;display:inline-flex;align-items:center;gap:7px;}
        .tool-bar .tool-title{font-family:var(--font-head);font-weight:600;font-size:15px;}
        #tool-frame{flex:1 1 auto;width:100%;border:none;}
        .brand:hover{opacity:.85;}
        /* ===== HISTORY MODAL ===== */
        .modal{display:none;position:fixed;inset:0;background:rgba(10,8,30,.6);z-index:3000;align-items:flex-start;justify-content:center;padding:60px 16px 16px;}
        .modal.show{display:flex;}
        .modal-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:460px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:popm .35s cubic-bezier(.18,.89,.32,1.28);}
        @keyframes popm{from{transform:scale(.85) translateY(-10px);opacity:0;}to{transform:none;opacity:1;}}
        .modal-card h3{font-family:var(--font-head);margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:8px;}
        .modal-card .msub{color:var(--muted);font-size:12px;margin:0 0 14px;}
        .hist-list{display:flex;flex-direction:column;gap:9px;max-height:50vh;overflow:auto;}
        .hist-row{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:10px 12px;}
        .hist-row .hi{color:var(--gold);font-size:15px;flex:0 0 auto;}
        .hist-row .hl{flex:1 1 auto;font-weight:700;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .hist-row button{border:none;cursor:pointer;border-radius:9px;padding:8px 11px;font-family:var(--font-body);font-weight:800;font-size:12px;display:inline-flex;align-items:center;gap:6px;}
        .hist-row .open{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;}
        .hist-row .del{background:transparent;color:var(--muted);border:1px solid var(--line);}
        .hist-row .del:hover{color:var(--danger,#ff3d7f);border-color:var(--danger,#ff3d7f);}
        .hist-empty{text-align:center;color:var(--muted);font-size:13px;padding:24px 8px;}
        .modal-actions{display:flex;justify-content:flex-end;margin-top:16px;}
        .modal-actions .close{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:9px 16px;cursor:pointer;font-family:var(--font-body);font-weight:800;}
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand" id="brandHome" onclick="goHome()" title="Back to all tools" style="cursor:pointer"><i class="fas fa-toolbox"></i> ClassTools</div>
        <div class="spacer"></div>
        <button class="icon-btn" id="histBtn" onclick="openHistory()" title="Starred tools history"><i class="fas fa-clock-rotate-left"></i></button>
        <button class="icon-btn" id="darkBtn" onclick="toggleDark()" title="Dark mode"><i class="fas fa-moon"></i></button>
    </div>

    <div id="menu-view">
        <div class="hub-header"><p></p></div>
        <div class="pinned" id="pinned">
            <i class="fas fa-star star"></i><span class="lbl" id="pinnedLbl"></span>
            <span class="go"></span>
            <button class="open" onclick="openPinned()"><i class="fas fa-play"></i> Open</button>
            <button class="clear" onclick="clearPinned()" title="Remove bookmark"><i class="fas fa-xmark"></i></button>
        </div>
        <div id="sections"></div>
        <div class="hub-footer">Made by Mr. Carlo &middot; Bookmark a tool (⭐) to auto-open it on this slide.</div>
    </div>

    <div id="tool-view">
        <iframe id="tool-frame" title="Active tool" allow="clipboard-write; camera"></iframe>
    </div>

    <div class="modal" id="histModal" onclick="if(event.target===this)closeHistory()">
        <div class="modal-card">
            <h3><i class="fas fa-star" style="color:var(--gold)"></i> Starred tools</h3>
            <p class="msub">Your bookmarked tools, saved on this device. Open one, or remove it from the list.</p>
            <div class="hist-list" id="histList"></div>
            <div class="modal-actions"><button class="close" onclick="closeHistory()">Close</button></div>
        </div>
    </div>

    <script>
        /* TOOL REGISTRY — grouped into sections. Append to add more. */
        const SECTIONS = [
            { name: 'Classroom Tools', tools: [
                { title: 'Timer Tools', desc: 'Countdown, stopwatch, pomodoro, race & more.', icon: 'fas fa-stopwatch', url: '../MyTimerAddin/timer.html', c1:'#25426B', c2:'#3D6396' },
                { title: 'Pickers, Pairings & Groupings', desc: 'Pick students, make pairs & groups, spinner.', icon: 'fas fa-dice', url: '../RandomPicker/picker.html', c1:'#2f6bff', c2:'#14d6c4' },
                { title: 'Intro & Reveal Tools', desc: "Mystery box, doors, envelopes, wheel, scratch & reveal.", icon: 'fas fa-wand-sparkles', url: '../IntroTools/intro.html', c1:'#f97316', c2:'#ff3d7f' }
            ]},
            { name: 'Gaming Tools', tools: [
                { title: 'Word Games & Builders', desc: 'Hangman, scramble, word search, crossword & more.', icon: 'fas fa-spell-check', url: '../WordGames/games.html', c1:'#ff3d7f', c2:'#f97316' },
                { title: 'Spelling Helper', desc: 'Listen & spell — type, click letters or letter blocks. Natural voice.', icon: 'fas fa-ear-listen', url: '../SpellingHelper/spelling.html', c1:'#3D6396', c2:'#25426B' },
                { title: 'Word Splitter', desc: 'Split words into syllables — arrange parts or fill the blanks, with audio & hints.', icon: 'fas fa-scissors', url: '../WordSplitter/splitter.html', c1:'#14d6c4', c2:'#2f6bff' },
                { title: 'Scoreboard & Scoring', desc: 'Teams, members & live scoring.', icon: 'fas fa-ranking-star', url: '../Scoreboard/scoreboard.html', c1:'#22c55e', c2:'#14d6c4' }
            ]}
        ];

        const sectionsEl = document.getElementById('sections');
        SECTIONS.forEach(sec => {
            const wrap = document.createElement('div'); wrap.className = 'section';
            wrap.innerHTML = '<h2>' + sec.name + '</h2>';
            const grid = document.createElement('div'); grid.className = 'tool-grid';
            sec.tools.forEach(t => {
                const card = document.createElement('div'); card.className = 'tool-card';
                card.style.setProperty('--c1', t.c1 || 'var(--primary)'); card.style.setProperty('--c2', t.c2 || 'var(--primary-2)');
                card.innerHTML = '<div class="icon"><i class="' + t.icon + '"></i></div><h3>' + t.title + '</h3><p>' + t.desc + '</p>';
                card.addEventListener('click', () => openUrl(t.url, t.title));
                grid.appendChild(card);
            });
            wrap.appendChild(grid); sectionsEl.appendChild(wrap);
        });

        function openUrl(url, title) {
            document.getElementById('tool-frame').src = url;
            document.querySelector('.topbar').style.display = 'none';
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('tool-view').style.display = 'flex';
        }
        function closeTool() {
            document.getElementById('tool-view').style.display = 'none';
            document.getElementById('tool-frame').src = 'about:blank';
            document.querySelector('.topbar').style.display = 'flex';
            document.getElementById('menu-view').style.display = 'block';
            refreshPinned();
        }
        // Clicking the ClassTools logo always returns to the main menu.
        function goHome() {
            if (document.getElementById('tool-view').style.display !== 'none') closeTool();
            else { document.querySelector('.topbar').style.display = 'flex'; document.getElementById('menu-view').style.display = 'block'; }
        }

        /* ===== SETTINGS (bookmark saved in the .pptx when available) ===== */
        let officeReady = false;
        function settingsGet(key) {
            if (officeReady) { try { const v = Office.context.document.settings.get(key); if (v != null) return v; } catch (e) {} }
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function settingsSet(key, val) {
            try { val == null ? localStorage.removeItem(key) : localStorage.setItem(key, val); } catch (e) {}
            if (officeReady) { try { if (val == null) Office.context.document.settings.remove(key); else Office.context.document.settings.set(key, val); Office.context.document.settings.saveAsync(); } catch (e) {} }
        }

        /* ===== BOOKMARK ===== */
        function getBookmark() { const raw = settingsGet('ct-bookmark'); if (!raw) return null; try { return JSON.parse(raw); } catch (e) { return null; } }
        function refreshPinned() {
            const bm = getBookmark(), box = document.getElementById('pinned');
            if (bm && bm.url) { box.style.display = 'flex'; document.getElementById('pinnedLbl').textContent = bm.label || 'Bookmarked tool'; }
            else box.style.display = 'none';
        }
        function openPinned() { const bm = getBookmark(); if (bm && bm.url) openUrl(bm.url, bm.label); }
        function clearPinned() { settingsSet('ct-bookmark', null); refreshPinned(); }

        /* ===== STARRED HISTORY (persistent on this device) ===== */
        const HIST_KEY = 'ct-star-history';
        function readHistory() { try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch (e) { return []; } }
        function writeHistory(list) { try { localStorage.setItem(HIST_KEY, JSON.stringify(list)); } catch (e) {} }
        function addHistory(url, label) {
            if (!url) return;
            const list = readHistory().filter(h => h.url !== url);
            list.unshift({ url: url, label: label || 'Bookmarked tool', ts: Date.now() });
            writeHistory(list.slice(0, 30));
        }
        function removeHistory(url) {
            writeHistory(readHistory().filter(h => h.url !== url));
            const bm = getBookmark(); if (bm && bm.url === url) clearPinned();
            renderHistory();
        }
        function renderHistory() {
            const list = readHistory(), box = document.getElementById('histList');
            if (!list.length) { box.innerHTML = '<div class="hist-empty"><i class="far fa-star"></i><br>No starred tools yet. Open a tool and tap its ⭐ to save it here.</div>'; return; }
            box.innerHTML = list.map(h =>
                '<div class="hist-row"><i class="fas fa-star hi"></i><span class="hl" title="' + h.label.replace(/"/g,'&quot;') + '">' + h.label.replace(/</g,'&lt;') + '</span>' +
                '<button class="open" onclick="openFromHistory(\'' + encodeURIComponent(h.url) + '\')"><i class="fas fa-play"></i> Open</button>' +
                '<button class="del" onclick="removeHistory(decodeURIComponent(\'' + encodeURIComponent(h.url) + '\'))" title="Remove"><i class="fas fa-xmark"></i></button></div>'
            ).join('');
        }
        function openFromHistory(encUrl) { const url = decodeURIComponent(encUrl); closeHistory(); openUrl(url, ''); }
        function openHistory() { renderHistory(); document.getElementById('histModal').classList.add('show'); }
        function closeHistory() { document.getElementById('histModal').classList.remove('show'); }

        // tools (in the iframe) post their bookmark up to here
        window.addEventListener('message', function (e) {
            const d = e.data; if (!d || d.ns !== 'classtools') return;
            if (d.cmd === 'bookmark') { settingsSet('ct-bookmark', d.url ? JSON.stringify({ url: d.url, label: d.label || 'Bookmarked tool' }) : null); if (d.url) addHistory(d.url, d.label); refreshPinned(); }
            if (d.cmd === 'close') closeTool();
        });

        /* ===== THEME ===== */
        const THEME_KEY = 'ct-theme';
        function readDark() { try { return localStorage.getItem(THEME_KEY) === 'dark'; } catch (e) { return false; } }
        function applyTheme(dark) { document.body.classList.toggle('dark-mode', dark); document.getElementById('darkBtn').innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>'; }
        function toggleDark() { const d = !document.body.classList.contains('dark-mode'); try { localStorage.setItem(THEME_KEY, d ? 'dark' : 'light'); } catch (e) {} applyTheme(d); }
        window.addEventListener('storage', function (e) { if (e.key === THEME_KEY) applyTheme(e.newValue === 'dark'); });

        /* ===== BOOT — auto-open the bookmarked tool ===== */
        function boot() {
            applyTheme(readDark());
            refreshPinned();
            const bm = getBookmark();
            if (bm && bm.url) openUrl(bm.url, bm.label);
        }
        if (window.Office && Office.onReady) { Office.onReady(function (info) { officeReady = !!(info && info.host); boot(); }); }
        else { boot(); }
    </script>
</body>
</html>
