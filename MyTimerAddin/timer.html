<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #15c4c4; --bg: #fdfdfd; --text: #333; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; overflow: hidden; background: transparent; }
        
        /* Container and Modes */
        .main-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; transition: 0.3s; border-radius: 15px; background: var(--bg); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Floating Toolbar */
        .mode-switcher { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; z-index: 100; opacity: 0.3; transition: 0.3s; }
        .mode-switcher:hover { opacity: 1; }
        .mode-btn { border: none; background: #eee; cursor: pointer; padding: 5px; border-radius: 5px; font-size: 12px; }

        /* Full Mode - Your original Tabs */
        #view-full { display: block; padding: 10px; overflow-y: auto; height: 100%; }
        
        /* Mini Time Mode */
        #view-mini-time { display: none; height: 100%; justify-content: center; align-items: center; font-size: 15vw; font-weight: bold; color: var(--accent); }

        /* Mini Circle Mode */
        #view-mini-circle { display: none; height: 100%; justify-content: center; align-items: center; }
        svg { transform: rotate(-90deg); width: 80%; height: 80%; }
        circle { fill: none; stroke-width: 8; stroke-linecap: round; }
        .bg-circle { stroke: #eee; }
        .progress-circle { stroke: var(--accent); stroke-dasharray: 251; stroke-dashoffset: 251; transition: 0.3s; }

        /* Helpers */
        .active-view { display: flex !important; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="mode-switcher">
        <button class="mode-btn" onclick="switchView('full')">Full</button>
        <button class="mode-btn" onclick="switchView('time')">12:00</button>
        <button class="mode-btn" onclick="switchView('circle')">◯</button>
    </div>

    <div class="main-container">
        <!-- FULL VIEW (Your Tabbed Logic goes here) -->
        <div id="view-full">
            <h3 style="margin-top:0">Timer Settings</h3>
            <input type="number" id="input-mins" value="5" style="width:50px"> min
            <button onclick="startGlobalTimer()">Start</button>
            <p style="font-size: 11px; color: #666;">Choose a mode top-right to float this timer.</p>
        </div>

        <!-- MINI TIME VIEW -->
        <div id="view-mini-time">05:00</div>

        <!-- MINI CIRCLE VIEW -->
        <div id="view-mini-circle">
            <svg viewBox="0 0 100 100">
                <circle class="bg-circle" cx="50" cy="50" r="40"></circle>
                <circle id="circle-progress" class="progress-circle" cx="50" cy="50" r="40"></circle>
            </svg>
        </div>
    </div>

<script>
    let timeLeft;
    let totalTime;
    let timerId;

    function switchView(mode) {
        document.getElementById('view-full').classList.add('hidden');
        document.getElementById('view-mini-time').classList.remove('active-view');
        document.getElementById('view-mini-circle').classList.remove('active-view');

        if (mode === 'full') document.getElementById('view-full').classList.remove('hidden');
        if (mode === 'time') document.getElementById('view-mini-time').classList.add('active-view');
        if (mode === 'circle') document.getElementById('view-mini-circle').classList.add('active-view');
    }

    function startGlobalTimer() {
        clearInterval(timerId);
        let mins = document.getElementById('input-mins').value;
        totalTime = mins * 60;
        timeLeft = totalTime;
        
        timerId = setInterval(() => {
            timeLeft--;
            updateDisplay();
            if (timeLeft <= 0) clearInterval(timerId);
        }, 1000);
    }

    function updateDisplay() {
        // Update Time Text
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        let timeStr = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        document.getElementById('view-mini-time').innerText = timeStr;

        // Update Circle (251 is circumference for r=40)
        let offset = 251 - (timeLeft / totalTime) * 251;
        document.getElementById('circle-progress').style.strokeDashoffset = offset;
    }
</script>
</body>
</html>
