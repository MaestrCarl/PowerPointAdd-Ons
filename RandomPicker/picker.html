<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Tools - PowerPoint</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- INTEGRATING YOUR ORIGINAL STYLES --- */
        :root {
            --accent-color-value: #15c4c4; --bg-color: #fdfdfd; --text-color: #333;
            --primary-color: var(--accent-color-value); --gray-color: #e0e0e0; --border-radius: 12px;
        }
        .dark-mode { --bg-color: #212529; --text-color: #dee2e6; --primary-color: #15c4c4; }

        body { font-family: 'Montserrat', sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; }
        
        /* Floating Toolbar for PPT */
        .view-toggle {
            position: fixed; top: 10px; right: 10px; z-index: 1000;
            display: flex; gap: 5px; opacity: 0.3; transition: 0.3s;
        }
        .view-toggle:hover { opacity: 1; }
        .view-toggle button { 
            background: var(--primary-color); color: white; border: none; 
            padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 10px;
        }

        /* Container & Layout */
        .full-view { display: block; padding: 20px; }
        .mini-view { 
            display: none; height: 100vh; width: 100vw; 
            justify-content: center; align-items: center; 
            text-align: center; background: var(--bg-color);
        }
        #mini-content { font-size: 8vw; font-weight: 700; color: var(--primary-color); padding: 20px; }

        /* Original Tab Styles */
        .tab-container { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 15px; border-bottom: 1px solid var(--gray-color); }
        .tab-button { background: none; border: none; padding: 10px; cursor: pointer; color: #888; font-family: inherit; font-weight: 600; }
        .tab-button.active { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Inputs & Cards */
        textarea { width: 100%; height: 100px; border-radius: 8px; border: 1px solid var(--gray-color); padding: 10px; font-family: inherit; }
        .tool-button { background: var(--primary-color); color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: 600; }
        .group-card { background: #eee; padding: 10px; border-radius: 8px; margin-bottom: 5px; text-align: left; }
        .dark-mode .group-card { background: #333; }
    </style>
</head>
<body>

    <div class="view-toggle">
        <button onclick="document.body.classList.toggle('dark-mode')"><i class="fas fa-moon"></i></button>
        <button onclick="setView('full')">Setup</button>
        <button onclick="setView('mini')">Results</button>
    </div>

    <!-- SETTINGS VIEW (FULL) -->
    <div id="full-view" class="full-view">
        <div class="tab-container">
            <button class="tab-button active" onclick="openTab(event, 'picker')">Picker</button>
            <button class="tab-button" onclick="openTab(event, 'groups')">Groups</button>
            <button class="tab-button" onclick="openTab(event, 'pairs')">Pairs</button>
        </div>

        <!-- Student Picker -->
        <div id="picker" class="tab-content active">
            <textarea id="list-picker" placeholder="Enter names here..."></textarea>
            <button class="tool-button" onclick="runPicker()">Pick Random Student</button>
        </div>

        <!-- Group Generator -->
        <div id="groups" class="tab-content">
            <textarea id="list-groups" placeholder="Enter names here..."></textarea>
            <div style="margin-top:10px">
                Groups: <input type="number" id="num-groups" value="2" style="width:40px">
            </div>
            <button class="tool-button" onclick="runGroups()">Generate Groups</button>
        </div>

        <!-- Pairs -->
        <div id="pairs" class="tab-content">
            <textarea id="list-pairs" placeholder="Enter names here..."></textarea>
            <button class="tool-button" onclick="runPairs()">Generate Pairs</button>
        </div>

        <div id="status" style="font-size: 0.8em; color: #888; margin-top: 15px; text-align: center;">Result will show in Mini View</div>
    </div>

    <!-- MINI DISPLAY VIEW -->
    <div id="mini-view" class="mini-view">
        <div id="mini-content">Ready...</div>
    </div>

    <script>
        function setView(v) {
            document.getElementById('full-view').style.display = v === 'full' ? 'block' : 'none';
            document.getElementById('mini-view').style.display = v === 'mini' ? 'flex' : 'none';
        }

        function openTab(evt, name) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function getList(id) {
            return document.getElementById(id).value.split('\n').filter(n => n.trim() !== '');
        }

        // --- PICKER LOGIC ---
        function runPicker() {
            const list = getList('list-picker');
            if (list.length === 0) return;
            const picked = list[Math.floor(Math.random() * list.length)];
            document.getElementById('mini-content').innerHTML = `<span style="font-size:0.4em">SELECTED:</span><br>${picked}`;
            setView('mini');
        }

        // --- GROUPS LOGIC ---
        function runGroups() {
            const list = getList('list-groups').sort(() => Math.random() - 0.5);
            const num = parseInt(document.getElementById('num-groups').value);
            if (list.length === 0) return;
            
            let resultHTML = '';
            for (let i = 0; i < num; i++) {
                resultHTML += `<div class="group-card"><strong>Group ${i+1}:</strong> `;
                const members = list.filter((_, idx) => idx % num === i);
                resultHTML += members.join(', ') + `</div>`;
            }
            document.getElementById('mini-content').innerHTML = `<div style="font-size:0.3em">${resultHTML}</div>`;
            setView('mini');
        }

        // --- PAIRS LOGIC ---
        function runPairs() {
            const list = getList('list-pairs').sort(() => Math.random() - 0.5);
            if (list.length < 2) return;
            
            let resultHTML = '';
            for (let i = 0; i < list.length; i += 2) {
                if (list[i+1]) {
                    resultHTML += `<div class="group-card">${list[i]} & ${list[i+1]}</div>`;
                } else {
                    resultHTML += `<div class="group-card">${list[i]} (No Partner)</div>`;
                }
            }
            document.getElementById('mini-content').innerHTML = `<div style="font-size:0.3em">${resultHTML}</div>`;
            setView('mini');
        }
    </script>
</body>
</html>
